<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Fizzle</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" href="assets/images/fizzle-mark.png">
  <link rel="apple-touch-icon" href="assets/images/fizzle-mark.png">

  <!-- Inline theme bootstrap: apply saved theme BEFORE Angular loads to prevent flash -->
  <script>
    (function () {
      var t = localStorage.getItem('fz-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>

  <!-- Inter (UI prose) + Geist Mono (code) — the DESIGN-mintlify.md pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
