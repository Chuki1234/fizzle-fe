<div class="home">
  <div class="home__stage">
    <!-- Welcome card -->
    <section class="home__card">
      <div class="home__art" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- ambient glow -->
          <circle cx="60" cy="58" r="46" fill="var(--color-accent)" opacity="0.08" />
          <!-- back bubble -->
          <rect x="26" y="30" width="52" height="40" rx="12"
                fill="var(--color-raised)" stroke="var(--color-hairline)" stroke-width="1.5" />
          <path d="M40 70v9l11-9" fill="var(--color-raised)" stroke="var(--color-hairline)" stroke-width="1.5" stroke-linejoin="round" />
          <line x1="37" y1="44" x2="67" y2="44" stroke="var(--color-steel)" stroke-width="3" stroke-linecap="round" />
          <line x1="37" y1="54" x2="58" y2="54" stroke="var(--color-muted)" stroke-width="3" stroke-linecap="round" />
          <!-- front bubble (accent) -->
          <rect x="52" y="52" width="46" height="36" rx="11"
                fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1.5" />
          <path d="M84 88v8l-10-8" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1.5" stroke-linejoin="round" />
          <line x1="61" y1="64" x2="89" y2="64" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" />
          <line x1="61" y1="74" x2="78" y2="74" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" opacity="0.55" />
          <!-- spark -->
          <path d="M92 26l-6 10h5l-4 9 11-13h-5l4-8z"
                fill="var(--color-accent)" stroke="var(--color-canvas)" stroke-width="1" stroke-linejoin="round" />
        </svg>
      </div>

      <h1 class="home__title">
        Chào {{ displayName() || 'bạn' }}, sẵn sàng trò chuyện chưa?
      </h1>
      <p class="home__subtitle">
        Chọn một cuộc trò chuyện ở thanh bên, hoặc bắt đầu ngay bên dưới.
      </p>

      <a class="home__cta" routerLink="/chat">
        <span class="mi" aria-hidden="true">chat</span>
        Nhắn tin ngay
      </a>
    </section>

    <!-- Quick actions -->
    <div class="home__actions">
      <button type="button" class="home__action" (click)="createServer()">
        <span class="home__action-icon" aria-hidden="true">
          <span class="mi">add_box</span>
        </span>
        <span class="home__action-label">Tạo máy chủ</span>
      </button>

      <a class="home__action" routerLink="/friends">
        <span class="home__action-icon" aria-hidden="true">
          <span class="mi">person_add</span>
        </span>
        <span class="home__action-label">Thêm bạn</span>
      </a>

      <button type="button" class="home__action" (click)="enterFirstServer()">
        <span class="home__action-icon" aria-hidden="true">
          <span class="mi">forum</span>
        </span>
        <span class="home__action-label">Vào máy chủ</span>
      </button>
    </div>

    <p class="home__hint">
      <span class="mi" aria-hidden="true">lock</span>
      Tin nhắn cá nhân của bạn được mã hoá đầu cuối.
    </p>
  </div>
</div>
