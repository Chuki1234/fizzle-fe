<form class="register-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (formError(); as message) {
    <fz-alert tone="error">{{ message }}</fz-alert>
  }

  <!-- Email Input -->
  <fz-form-field label="Địa chỉ Email" [required]="true" [error]="emailError()" #emailField>
    <input
      fzInput
      type="email"
      formControlName="email"
      [id]="emailField.controlId"
      [fzInvalid]="!!emailError()"
      [attr.aria-describedby]="emailField.describedBy()"
      [attr.aria-invalid]="emailField.ariaInvalid()"
      placeholder="name@company.com"
      autocomplete="email"
      inputmode="email"
      autocapitalize="none"
      spellcheck="false"
    />
  </fz-form-field>

  <!-- Display Name Input -->
  <fz-form-field
    label="Tên hiển thị"
    hint="Tên hiển thị công khai của bạn trên Fizzle."
    [error]="displayNameError()"
    #displayNameField
  >
    <input
      fzInput
      type="text"
      formControlName="displayName"
      [id]="displayNameField.controlId"
      [fzInvalid]="!!displayNameError()"
      [attr.aria-describedby]="displayNameField.describedBy()"
      [attr.aria-invalid]="displayNameField.ariaInvalid()"
      placeholder="Nguyễn Văn A"
      autocomplete="nickname"
    />
  </fz-form-field>

  <!-- Username Input -->
  <fz-form-field
    label="Tên đăng nhập"
    [required]="true"
    hint="Chỉ dùng chữ thường, số, dấu chấm và gạch dưới."
    [error]="usernameError()"
    #usernameField
  >
    <input
      fzInput
      type="text"
      formControlName="username"
      [id]="usernameField.controlId"
      [fzInvalid]="!!usernameError()"
      [attr.aria-describedby]="usernameField.describedBy()"
      [attr.aria-invalid]="usernameField.ariaInvalid()"
      placeholder="alex_dev"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
    />
  </fz-form-field>

  <!-- Phone Number Input (Optional) -->
  <fz-form-field
    label="Số điện thoại"
    hint="Không bắt buộc. Định dạng: 0901234567 hoặc +84901234567."
    [error]="phoneError()"
    #phoneField
  >
    <div class="register-form__phone-wrap">
      <span class="register-form__phone-prefix">
        <span class="mi" aria-hidden="true">call</span>
      </span>
      <input
        fzInput
        type="tel"
        formControlName="phone"
        [id]="phoneField.controlId"
        [fzInvalid]="!!phoneError()"
        [attr.aria-describedby]="phoneField.describedBy()"
        [attr.aria-invalid]="phoneField.ariaInvalid()"
        placeholder="0901 234 567"
        autocomplete="tel"
        inputmode="tel"
        class="register-form__phone-input"
      />
    </div>
  </fz-form-field>

  <!-- Password Input with Strength Meter & Toggle -->
  <fz-form-field
    label="Mật khẩu"
    [required]="true"
    hint="Ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số."
    [error]="passwordError()"
    #passwordField
  >
    <div class="register-form__password-wrap">
      <input
        fzInput
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        [id]="passwordField.controlId"
        [fzInvalid]="!!passwordError()"
        [attr.aria-describedby]="passwordField.describedBy()"
        [attr.aria-invalid]="passwordField.ariaInvalid()"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <button
        type="button"
        class="register-form__toggle-pw"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        tabindex="-1"
      >
        @if (showPassword()) {
          <span class="mi" aria-hidden="true">visibility_off</span>
        } @else {
          <span class="mi" aria-hidden="true">visibility</span>
        }
      </button>
    </div>

    <!-- Password Strength Meter -->
    @if (passwordStrength().score > 0) {
      <div class="register-form__pw-meter">
        <div class="register-form__pw-meter-bar">
          <div
            class="register-form__pw-meter-fill"
            [class.fill--error]="passwordStrength().tone === 'error'"
            [class.fill--warn]="passwordStrength().tone === 'warn'"
            [class.fill--info]="passwordStrength().tone === 'info'"
            [class.fill--success]="passwordStrength().tone === 'success'"
            [style.width.%]="passwordStrength().percent"
          ></div>
        </div>
        <span class="register-form__pw-meter-text">
          Độ mạnh mật khẩu: <strong [class]="'text--' + passwordStrength().tone">{{ passwordStrength().label }}</strong>
        </span>
      </div>
    }
  </fz-form-field>

  <!-- Birthday Group -->
  <fieldset class="register-form__birthdate">
    <legend class="register-form__legend">
      <span>Ngày sinh</span>
      <span class="register-form__required" aria-hidden="true">*</span>
      <span class="sr-only">(bắt buộc)</span>
      @if (birthdateError(); as message) {
        <span class="register-form__legend-error"> — {{ message }}</span>
      }
    </legend>

    <div class="register-form__birthdate-grid">
      <label class="sr-only" for="birth-day">Ngày</label>
      <select
        fzInput
        id="birth-day"
        formControlName="birthDay"
        [fzInvalid]="!!birthdateError()"
        [attr.aria-invalid]="birthdateError() ? 'true' : null"
      >
        <option value="" disabled>Ngày</option>
        @for (day of days; track day) {
          <option [value]="day">{{ day }}</option>
        }
      </select>

      <label class="sr-only" for="birth-month">Tháng</label>
      <select
        fzInput
        id="birth-month"
        formControlName="birthMonth"
        [fzInvalid]="!!birthdateError()"
        [attr.aria-invalid]="birthdateError() ? 'true' : null"
      >
        <option value="" disabled>Tháng</option>
        @for (month of months; track month) {
          <option [value]="month">{{ month }}</option>
        }
      </select>

      <label class="sr-only" for="birth-year">Năm</label>
      <select
        fzInput
        id="birth-year"
        formControlName="birthYear"
        [fzInvalid]="!!birthdateError()"
        [attr.aria-invalid]="birthdateError() ? 'true' : null"
      >
        <option value="" disabled>Năm</option>
        @for (year of years; track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </div>

    @if (birthdateError(); as message) {
      <p class="sr-only" role="alert">{{ message }}</p>
    }
  </fieldset>

  <!-- Marketing Checkbox -->
  <label class="fz-checkbox">
    <input type="checkbox" formControlName="acceptsMarketingEmail" />
    <span class="fz-checkbox__label">
      Nhận email thông báo cập nhật tính năng mới & bản tin dành cho nhà phát triển từ Fizzle.
    </span>
  </label>

  <!-- Submit Button -->
  <fz-button
    type="submit"
    variant="accent"
    size="lg"
    [block]="true"
    [loading]="submitting()"
  >
    Tạo tài khoản ngay
  </fz-button>
</form>
