<form class="otp" (ngSubmit)="submit()" novalidate>
  <p class="otp__intro">
    Mã xác thực 8 số đã được gửi tới địa chỉ email:
    <strong class="otp__email">{{ email() }}</strong>
  </p>

  @if (formError(); as message) {
    <fz-alert tone="error">{{ message }}</fz-alert>
  }

  @if (notice(); as message) {
    <fz-alert tone="success">{{ message }}</fz-alert>
  }

  <!-- 6-Box OTP Input -->
  <div class="otp__input-wrapper">
    <fz-otp-input
      [(value)]="otpCode"
      [length]="otpLength"
      (completed)="submit()"
    />
  </div>

  <!-- Submit Button -->
  <fz-button
    type="submit"
    variant="accent"
    size="lg"
    [block]="true"
    [loading]="submitting()"
    [disabled]="otpCode().length < otpLength"
  >
    Xác nhận & Hoàn tất
  </fz-button>

  <!-- Resend Action -->
  <div class="otp__resend">
    <span>Chưa nhận được mã OTP?</span>
    <fz-button
      variant="link"
      [disabled]="!canResend()"
      [loading]="resending()"
      (click)="resend()"
    >
      @if (cooldown() > 0) {
        Gửi lại mã sau {{ cooldown() }}s
      } @else {
        Gửi lại mã ngay
      }
    </fz-button>
  </div>
</form>
