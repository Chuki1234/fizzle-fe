<section class="register-card" aria-labelledby="register-title">
  @if (step() === 'form') {
    <header class="register-card__header">
      <h1 class="register-card__title text-heading-3" id="register-title">
        Tạo tài khoản
      </h1>
    </header>

    <fz-register-form (registered)="onRegistered($event)" />

    <p class="register-card__footer">
      Đã có tài khoản?
      <a class="register-card__link" routerLink="/auth/login">Đăng nhập</a>
    </p>
  } @else {
    <header class="register-card__header">
      <h1 class="register-card__title text-heading-3" id="register-title">
        Xác thực email
      </h1>
    </header>

    <fz-otp-verify [email]="pendingEmail()" />

    <p class="register-card__footer">
      Nhập sai email?
      <button class="register-card__link" type="button" (click)="backToForm()">
        Quay lại
      </button>
    </p>
  }
</section>
