<form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (formError(); as message) {
    <fz-alert tone="error">{{ message }}</fz-alert>
  }

  <fz-form-field label="Email" [required]="true" [error]="emailError()" #emailField>
    <input
      fzInput
      type="email"
      formControlName="email"
      [id]="emailField.controlId"
      [fzInvalid]="!!emailError()"
      [attr.aria-describedby]="emailField.describedBy()"
      [attr.aria-invalid]="emailField.ariaInvalid()"
      autocomplete="email"
      inputmode="email"
      autocapitalize="none"
      spellcheck="false"
    />
  </fz-form-field>

  <fz-form-field
    label="Mật khẩu"
    [required]="true"
    [error]="passwordError()"
    #passwordField
  >
    <input
      fzInput
      type="password"
      formControlName="password"
      [id]="passwordField.controlId"
      [fzInvalid]="!!passwordError()"
      [attr.aria-describedby]="passwordField.describedBy()"
      [attr.aria-invalid]="passwordField.ariaInvalid()"
      autocomplete="current-password"
    />
  </fz-form-field>

  <!--
    Not a link: the click sends the recovery email using the address typed
    above, so it needs that address to be valid first. `title` explains the
    disabled state, which a bare greyed-out control never does.
  -->
  <div class="login-form__forgot">
    <fz-button
      variant="link"
      [disabled]="!canRequestReset()"
      [loading]="sendingResetCode()"
      (click)="requestReset()"
    >
      Quên mật khẩu?
    </fz-button>
    @if (!canRequestReset() && !sendingResetCode()) {
      <span class="login-form__forgot-hint">Nhập email để nhận mã đặt lại.</span>
    }
  </div>

  <fz-button
    type="submit"
    variant="accent"
    size="lg"
    [block]="true"
    [loading]="submitting()"
  >
    Đăng nhập
  </fz-button>
</form>
