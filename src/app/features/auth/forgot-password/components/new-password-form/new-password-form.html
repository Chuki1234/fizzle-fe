<form class="new-password-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (formError(); as message) {
    <fz-alert tone="error">{{ message }}</fz-alert>
  }

  <!-- New Password Field -->
  <fz-form-field
    label="Mật khẩu mới"
    [required]="true"
    hint="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số."
    [error]="passwordError()"
    #passwordField
  >
    <div class="new-password-form__password-wrap">
      <input
        fzInput
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        [id]="passwordField.controlId"
        [fzInvalid]="!!passwordError()"
        [attr.aria-describedby]="passwordField.describedBy()"
        [attr.aria-invalid]="passwordField.ariaInvalid()"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <button
        type="button"
        class="new-password-form__toggle-pw"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        tabindex="-1"
      >
        @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        }
      </button>
    </div>

    <!-- Password Strength Meter -->
    @if (passwordStrength().score > 0) {
      <div class="new-password-form__pw-meter">
        <div class="new-password-form__pw-meter-bar">
          <div
            class="new-password-form__pw-meter-fill"
            [class.fill--error]="passwordStrength().tone === 'error'"
            [class.fill--warn]="passwordStrength().tone === 'warn'"
            [class.fill--info]="passwordStrength().tone === 'info'"
            [class.fill--success]="passwordStrength().tone === 'success'"
            [style.width.%]="passwordStrength().percent"
          ></div>
        </div>
        <span class="new-password-form__pw-meter-text">
          Độ mạnh mật khẩu: <strong [class]="'text--' + passwordStrength().tone">{{ passwordStrength().label }}</strong>
        </span>
      </div>
    }
  </fz-form-field>

  <!-- Confirm Password Field -->
  <fz-form-field
    label="Xác nhận mật khẩu mới"
    [required]="true"
    [error]="confirmPasswordError()"
    #confirmField
  >
    <input
      fzInput
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="confirmPassword"
      [id]="confirmField.controlId"
      [fzInvalid]="!!confirmPasswordError()"
      [attr.aria-describedby]="confirmField.describedBy()"
      [attr.aria-invalid]="confirmField.ariaInvalid()"
      placeholder="••••••••"
      autocomplete="new-password"
    />
  </fz-form-field>

  <!-- Submit Button -->
  <fz-button
    type="submit"
    variant="accent"
    size="lg"
    [block]="true"
    [loading]="submitting()"
  >
    Lưu mật khẩu mới
  </fz-button>
</form>
