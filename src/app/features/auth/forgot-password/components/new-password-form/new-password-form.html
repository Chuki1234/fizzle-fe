<form class="new-password" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <p class="new-password__intro">
    Xác thực thành công. Hãy chọn mật khẩu mới cho tài khoản của bạn.
  </p>

  @if (formError(); as message) {
    <fz-alert tone="error">{{ message }}</fz-alert>
  }

  <fz-form-field
    label="Mật khẩu mới"
    [required]="true"
    hint="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số. Không trùng mật khẩu cũ."
    [error]="passwordError()"
    #passwordField
  >
    <input
      fzInput
      type="password"
      formControlName="password"
      [id]="passwordField.controlId"
      [fzInvalid]="!!passwordError()"
      [attr.aria-describedby]="passwordField.describedBy()"
      [attr.aria-invalid]="passwordField.ariaInvalid()"
      autocomplete="new-password"
    />
  </fz-form-field>

  <fz-form-field
    label="Nhập lại mật khẩu mới"
    [required]="true"
    [error]="confirmPasswordError()"
    #confirmField
  >
    <input
      fzInput
      type="password"
      formControlName="confirmPassword"
      [id]="confirmField.controlId"
      [fzInvalid]="!!confirmPasswordError()"
      [attr.aria-describedby]="confirmField.describedBy()"
      [attr.aria-invalid]="confirmField.ariaInvalid()"
      autocomplete="new-password"
    />
  </fz-form-field>

  <fz-button
    type="submit"
    variant="accent"
    size="lg"
    [block]="true"
    [loading]="submitting()"
  >
    Đặt lại mật khẩu
  </fz-button>
</form>
